- name: feat
  color: 0e8a16
  description: New feature or capability

- name: fix
  color: d73a4a
  description: Bug fix

- name: docs
  color: 0075ca
  description: Documentation only changes

- name: chore
  color: fef2c0
  description: Maintenance, tooling, or repo housekeeping

- name: refactor
  color: c5def5
  description: Code change that neither fixes a bug nor adds a feature

- name: test
  color: bfd4f2
  description: Adding or correcting tests

- name: dependencies
  color: 0366d6
  description: Dependency updates

- name: breaking-change
  color: b60205
  description: Introduces a breaking change (triggers a major version bump)

- name: needs-triage
  color: ededed
  description: Not yet triaged
